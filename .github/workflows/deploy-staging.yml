name: Deploy to Staging

on:
  push:
    branches: [phase-10-beta-readiness]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/scheduler-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/scheduler-frontend
  STAGING_TAG: staging

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/scheduler-backend:${{ env.STAGING_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/scheduler-backend:${{ env.STAGING_TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/scheduler-frontend:${{ env.STAGING_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/scheduler-frontend:${{ env.STAGING_TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://${{ secrets.AZURE_BACKEND_APP_NAME }}.azurewebsites.net
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          slot-name: production
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/scheduler-backend:${{ env.STAGING_TAG }}

      - name: Run database migrations
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
          
          # Run migrations via Azure App Service console or use a separate step
          # For now, migrations should be run manually or via a scheduled job

  deploy-frontend:
    name: Deploy Frontend to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://${{ secrets.AZURE_FRONTEND_APP_NAME }}.azurewebsites.net
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_FRONTEND_APP_NAME }}
          slot-name: production
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/scheduler-frontend:${{ env.STAGING_TAG }}

  verify-deployment:
    name: Verify Staging Deployment
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    
    steps:
      - name: Check backend health
        run: |
          curl -f https://${{ secrets.AZURE_BACKEND_APP_NAME }}.azurewebsites.net/health || exit 1

      - name: Check frontend health
        run: |
          curl -f https://${{ secrets.AZURE_FRONTEND_APP_NAME }}.azurewebsites.net/health || exit 1
