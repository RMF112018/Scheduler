name: E2E Tests - Phase 13

on:
  push:
    branches: [main, phase-10-beta-readiness, phase-13-e2e]
  pull_request:
    branches: [main, phase-10-beta-readiness]
  workflow_dispatch:

jobs:
  tier1-smoke:
    name: Tier 1 - Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: scheduler
          POSTGRES_PASSWORD: scheduler_dev_password
          POSTGRES_DB: scheduler_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        browser: [chromium, webkit]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm prisma generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://scheduler:scheduler_dev_password@localhost:5432/scheduler_test
        run: pnpm prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: pnpm build

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Run Tier 1 Smoke Tests
        env:
          DATABASE_URL: postgresql://scheduler:scheduler_dev_password@localhost:5432/scheduler_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: test-jwt-secret-key
          TEST_DATABASE_URL: postgresql://scheduler:scheduler_dev_password@localhost:5432/scheduler_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: pnpm exec playwright test tests/e2e/specs/tier1-smoke.spec.ts --project=${{ matrix.browser }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/

