  all-tests-summary:
    name: All Tests Summary
    runs-on: ubuntu-latest
    needs: [tier1-smoke, tier2-guid-persistence, tier3-security-performance, visual-regression]
    if: always()

    steps:
      - name: All E2E tests completed
        run: |
          echo "✅ Tier 1: Smoke Suite - ${{ needs.tier1-smoke.result }}"
